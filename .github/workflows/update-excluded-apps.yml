name: Update Excluded Apps List

on:
  schedule:
    # Runs every 288 minutes off-peak (00:07, 04:55, 09:43, 14:31, 19:19 UTC)
    - cron: '7 0 * * *'
    - cron: '55 4 * * *'
    - cron: '43 9 * * *'
    - cron: '31 14 * * *'
    - cron: '19 19 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-list:
    runs-on: ubuntu-slim

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Update-ExcludedApps script
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/Update-ExcludedApps.ps1 -DaysThreshold 5 -Verbose

      - name: Commit and push updated excluded_apps.txt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f list/excluded_apps.txt config/default_excluded_apps.txt mods/ index.html
          if git diff --staged --quiet; then
            echo "No changes in excluded_apps.txt"
          else
            git commit -m "auto: update excluded_apps.txt [skip ci]"
            git push
          fi
